[package]
name = "radio-recorder"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
cpal = "0.15.3"
crossterm = "0.28"
ctrlc = "3.4"
hound = "3.5.1"
mp3lame-encoder = { version = "=0.2.5", features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.1.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
